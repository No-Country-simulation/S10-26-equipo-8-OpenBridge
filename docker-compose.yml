services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openbridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openbridge}
      POSTGRES_DB: ${POSTGRES_DB:-openbridge}
      # psql inside the container connects with these (used by npm run db:psql)
      PGUSER: ${POSTGRES_USER:-openbridge}
      PGDATABASE: ${POSTGRES_DB:-openbridge}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
