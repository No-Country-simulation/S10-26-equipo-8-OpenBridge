schema_version: '2.0'
project: OpenBridge
purpose: Seed reproducible del catálogo inicial de repositorios open source (OB-16)
review_date: '2026-10-28'
minimum_stars: 501
license_policy:
  Solo licencias aprobadas por la OSI. En proyectos open core (núcleo OSI y una carpeta
  enterprise con licencia comercial) se registra la licencia del núcleo.
categories: [auth, database, payments, ai, analytics, search]
validation_note:
  Los slugs de categories coinciden con backend/src/db/seed.ts. Las estrellas, el estado
  de archivo y la actividad los trae la ingesta desde GitHub; este archivo solo define qué repos entran
  y en qué categorías.
